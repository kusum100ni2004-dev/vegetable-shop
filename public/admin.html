<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>

<style>
body{
font-family:Arial;
padding:30px;
}

input{
display:block;
margin:10px 0;
padding:10px;
width:300px;
}

button{
padding:10px 20px;
background:green;
color:white;
border:none;
cursor:pointer;
}
</style>

</head>
<body>

<h1>Add Product</h1>

<input type="text" id="name" placeholder="Product Name">

<input type="number" id="price" placeholder="Price">

<input type="file" id="image">

<button onclick="addProduct()">Add Product</button>

<h1>Admin Added Products</h1>
<div id="adminProducts"></div>

<h1>Orders</h1>

<div id="orders"></div>

<div id="cartItems" class="cart-container"></div>


<h2 id="total"></h2>

<script>

async function addProduct(){

    let name = document.getElementById("name").value;
    let price = document.getElementById("price").value;
    let file = document.getElementById("image").files[0];

    if(!file){
        alert("Please select an image");
        return;
    }

    let reader = new FileReader();

    reader.onload = async function(){

        const res = await fetch("http://localhost:5000/api/products", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                name: name,
                price: price,
                image: reader.result
            })
        });

        const data = await res.json();

        if(data.success){
            alert("Product Added Successfully");
            location.reload();
        }
    };

    reader.readAsDataURL(file);
}

async function loadProducts(){

    const res = await fetch("http://localhost:5000/api/products");
    const products = await res.json();

    let productHtml = "";

    products.forEach(product => {
        productHtml += `
        <div style="border:1px solid #ccc;padding:10px;margin:10px 0;">
            <img src="${product.image}" width="120"><br><br>
            <b>${product.name}</b><br>
            ₹${product.price}<br><br>
            <button onclick="deleteProduct('${product._id}')">Delete Product</button>
        </div>
        `;
    });

    document.getElementById("adminProducts").innerHTML = productHtml;
}

async function deleteProduct(id){
    await fetch("http://localhost:5000/api/products/" + id, {
        method: "DELETE"
    });
    loadProducts();
}

async function loadOrders(){

    const res = await fetch("http://localhost:5000/api/orders");
    const orders = await res.json();

    let html = "";

    orders.forEach((order, index) => {
        html += `<h2>Order ${index+1}</h2>`;
        html += `<p>${new Date(order.createdAt).toLocaleString()}</p>`;

        order.items.forEach(item => {
            html += `<p>${item.name} | Qty:${item.quantity} | ₹${item.price * item.quantity}</p>`;
        });

        html += `<p><b>Total: ₹${order.total}</b></p><hr>`;
    });

    document.getElementById("orders").innerHTML = html;
}

loadProducts();
loadOrders();

</script>


</body>
</html>
