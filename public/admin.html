```html
<!DOCTYPE html>
<html>
<head>
    <title>Admin Panel</title>

    <style>
        body {
            font-family: Arial;
            padding: 30px;
        }

        input {
            display: block;
            margin: 10px 0;
            padding: 10px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.85;
        }

        .product-card {
            border: 1px solid #ccc;
            padding: 10px;
            margin: 10px 0;
            width: 300px;
        }

        .product-card img {
            max-width: 120px;
            max-height: 120px;
        }

        .order-card {
            border: 1px solid #ccc;
            padding: 15px;
            margin: 15px 0;
            width: 400px;
        }
    </style>

</head>

<body>

    <h1>Add Product</h1>

    <input
        type="text"
        id="name"
        placeholder="Product Name"
    >

    <input
        type="number"
        id="price"
        placeholder="Price"
    >

    <input
        type="file"
        id="image"
        accept="image/*"
    >

    <button onclick="addProduct()">Add Product</button>


    <h1>Admin Added Products</h1>

    <div id="adminProducts"></div>


    <h1>Orders</h1>

    <div id="orders"></div>


    <script>

        // =========================
        // ADD PRODUCT
        // =========================

        async function addProduct() {

            const name = document.getElementById("name").value.trim();
            const price = document.getElementById("price").value;
            const file = document.getElementById("image").files[0];

            if (!name) {
                alert("Please enter product name");
                return;
            }

            if (!price) {
                alert("Please enter product price");
                return;
            }

            if (!file) {
                alert("Please select an image");
                return;
            }

            const reader = new FileReader();

            reader.onload = async function () {

                try {

                    const res = await fetch("/api/products", {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            name: name,
                            price: Number(price),
                            image: reader.result
                        })
                    });

                    const data = await res.json();

                    if (res.ok && data.success) {

                        alert("Product Added Successfully 🎉");

                        document.getElementById("name").value = "";
                        document.getElementById("price").value = "";
                        document.getElementById("image").value = "";

                        loadProducts();

                    } else {

                        alert(
                            "Product add failed: " +
                            (data.error || "Something went wrong")
                        );

                        console.log("Add Product Error:", data);
                    }

                } catch (error) {

                    console.error("Add Product Error:", error);

                    alert(
                        "Server se connection nahi ho raha. Please try again."
                    );
                }
            };

            reader.readAsDataURL(file);
        }


        // =========================
        // LOAD PRODUCTS
        // =========================

        async function loadProducts() {

            try {

                const res = await fetch("/api/products");

                if (!res.ok) {
                    throw new Error("Products load nahi ho rahe");
                }

                const products = await res.json();

                let productHtml = "";

                if (products.length === 0) {

                    productHtml = "<h3>No products added yet.</h3>";

                } else {

                    products.forEach(product => {

                        productHtml += `
                            <div class="product-card">

                                <img
                                    src="${product.image}"
                                    alt="${product.name}"
                                >

                                <br><br>

                                <b>${product.name}</b>

                                <br>

                                ₹${product.price}

                                <br><br>

                                <button
                                    onclick="deleteProduct('${product._id}')"
                                >
                                    Delete Product
                                </button>

                            </div>
                        `;
                    });
                }

                document.getElementById("adminProducts").innerHTML =
                    productHtml;

            } catch (error) {

                console.error("Load Products Error:", error);

                document.getElementById("adminProducts").innerHTML =
                    "<p>Products load nahi ho rahe.</p>";
            }
        }


        // =========================
        // DELETE PRODUCT
        // =========================

        async function deleteProduct(id) {

            if (!confirm("Are you sure you want to delete this product?")) {
                return;
            }

            try {

                const res = await fetch("/api/products/" + id, {
                    method: "DELETE"
                });

                const data = await res.json();

                if (res.ok && data.success) {

                    alert("Product Deleted Successfully");

                    loadProducts();

                } else {

                    alert(
                        "Delete failed: " +
                        (data.error || "Something went wrong")
                    );

                    console.log("Delete Error:", data);
                }

            } catch (error) {

                console.error("Delete Product Error:", error);

                alert(
                    "Server se connection nahi ho raha."
                );
            }
        }


        // =========================
        // LOAD ORDERS
        // =========================

        async function loadOrders() {

            try {

                const res = await fetch("/api/orders");

                if (!res.ok) {
                    throw new Error("Orders load nahi ho rahe");
                }

                const orders = await res.json();

                let html = "";

                if (orders.length === 0) {

                    html = "<h3>No orders yet.</h3>";

                } else {

                    orders.forEach((order, index) => {

                        html += `
                            <div class="order-card">

                                <h2>
                                    Order ${index + 1}
                                </h2>

                                <p>
                                    <b>Date:</b>
                                    ${new Date(
                                        order.createdAt
                                    ).toLocaleString()}
                                </p>
                        `;

                        order.items.forEach(item => {

                            html += `
                                <p>
                                    ${item.name}
                                    |
                                    Qty: ${item.quantity}
                                    |
                                    ₹${item.price * item.quantity}
                                </p>
                            `;
                        });

                        html += `
                                <p>
                                    <b>
                                        Total: ₹${order.total}
                                    </b>
                                </p>

                            </div>
                        `;
                    });
                }

                document.getElementById("orders").innerHTML = html;

            } catch (error) {

                console.error("Load Orders Error:", error);

                document.getElementById("orders").innerHTML =
                    "<p>Orders load nahi ho rahe.</p>";
            }
        }


        // =========================
        // PAGE LOAD
        // =========================

        loadProducts();
        loadOrders();

    </script>

</body>
</html>
```
