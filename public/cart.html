<!DOCTYPE html>
<html>
<head>
    <title>My Cart</title>
    <link rel="stylesheet" href="cart.css">
</head>

<body>

<header>
    <div class="logo">🥕 Fresh Grocery</div>

    <nav>
        <a href="home.html">Home</a>
        <a href="cart.html">Cart</a>
    </nav>
</header>

<section class="cart-page">

    <h1>🛒 My Cart</h1>

    <div id="cartItems" class="cart-container"></div>

    <h2 id="total"></h2>

    <!-- <a href="contact.html">
        <button class="place-btn" onclick="placeOrder()">
            Place Order
        </button>
    </a> -->
    <button class="place-btn" onclick="placeOrder()">Place Order</button>

</section>

<script>

let cart = JSON.parse(localStorage.getItem("cart")) || [];

function displayCart() {

    const cartDiv = document.getElementById("cartItems");
    const totalDiv = document.getElementById("total");

    cartDiv.innerHTML = "";

    let total = 0;

    if(cart.length === 0){

        cartDiv.innerHTML = "<h2>Your cart is empty 🛒</h2>";
        totalDiv.innerText = "";
        return;
    }

    cart.forEach((item,index) => {

        total += item.price * item.quantity;

        cartDiv.innerHTML += `

        <div class="cart-card">

            <h3>${item.name}</h3>

            <p>Price : ₹${item.price}</p>

            <p>
                <button onclick="decreaseQty(${index})">-</button>

                <strong> ${item.quantity} </strong>

                <button onclick="increaseQty(${index})">+</button>
            </p>

            <p>
                Total : ₹${item.price * item.quantity}
            </p>

            <button onclick="removeItem(${index})">
                Remove
            </button>

        </div>

        `;
    });

    totalDiv.innerText = "Total Price : ₹" + total;
}

function increaseQty(index){

    cart[index].quantity++;

    localStorage.setItem("cart", JSON.stringify(cart));

    displayCart();
}

function decreaseQty(index){

    cart[index].quantity--;

    if(cart[index].quantity <= 0){

        cart.splice(index,1);
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    displayCart();
}

function removeItem(index){

    cart.splice(index,1);

    localStorage.setItem("cart", JSON.stringify(cart));

    displayCart();
}
async function placeOrder(){

    if(cart.length === 0){
        alert("Cart is empty");
        return;
    }

    let total = cart.reduce((sum, item) => sum + item.price * item.quantity, 0);

    const res = await fetch("http://localhost:5000/api/orders", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ items: cart, total: total })
    });

    const data = await res.json();

    if(data.success){
        alert("Order placed successfully 🥳");
        localStorage.removeItem("cart");
        cart = [];
        window.location.href = "contact.html";
    }
}

displayCart(); 

</script>


</body>
</html>
